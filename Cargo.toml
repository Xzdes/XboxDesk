[package]
name = "xboxdesk"
version = "0.1.0"
edition = "2021"
publish = false
description = "Xbox gamepad → keyboard & mouse mapper with customizable hotkeys, modern dark gaming UI, zero runtime dependencies"
license = "MIT"
readme = "README.md"
keywords = ["xinput", "gamepad", "keyboard", "mouse", "windows", "gaming", "accessibility", "win32"]
categories = ["os::windows-apis", "external-ffi-bindings", "command-line-utilities"]

[[bin]]
name = "XboxDesk"
path = "src/main.rs"

# Единственный crate — тонкие FFI-биндинги Microsoft (как в alibi-quic).
# В exe уезжают статическим кодом; из внешнего — только системные DLL Windows.
[dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
]

# Профили как в alibi-quic: один компактный статический exe.
[profile.release]
codegen-units = 1
lto = "thin"
strip = true
